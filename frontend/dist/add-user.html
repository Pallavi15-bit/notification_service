<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Add User - Notification System</title> <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"> <style> :root { --primary-color: #6c5ce7; --primary-hover: #5649c0; --success-color: #00b894; --error-color: #d63031; --text-color: #f5f6fa; --light-text: #dfe6e9; --border-color: #2d3436; --bg-color: #0f0f1a; --card-bg: #1e1e2e; --input-bg: #2c2c3c; --card-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); --accent-gradient: linear-gradient(135deg, #6c5ce7, #a29bfe); }
text
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background-color: var(--bg-color);
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(108, 92, 231, 0.15) 0%, transparent 20%),
            radial-gradient(circle at 90% 80%, rgba(162, 155, 254, 0.1) 0%, transparent 20%);
        color: var(--text-color);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        background-color: var(--card-bg);
        border-radius: 16px;
        box-shadow: var(--card-shadow);
        width: 100%;
        max-width: 550px;
        padding: 2.5rem;
        transition: all 0.3s ease;
        border: 1px solid rgba(108, 92, 231, 0.2);
        position: relative;
        overflow: hidden;
    }

    .container::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: var(--accent-gradient);
        opacity: 0.05;
        pointer-events: none;
        transform: rotate(-15deg);
        z-index: 0;
    }

    .container:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
        color: var(--primary-color);
        margin-bottom: 1.8rem;
        font-weight: 600;
        font-size: 1.8rem;
        text-align: center;
        position: relative;
        z-index: 1;
    }

    h1::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 50px;
        height: 3px;
        background: var(--accent-gradient);
        border-radius: 3px;
    }

    .form-group {
        margin-bottom: 1.5rem;
        position: relative;
        z-index: 1;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: var(--light-text);
    }

    input[type="text"],
    input[type="email"] {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
        font-family: 'Poppins', sans-serif;
        background-color: var(--input-bg);
        color: var(--text-color);
    }

    input[type="text"]:focus,
    input[type="email"]:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.3);
    }

    input[type="text"]::placeholder,
    input[type="email"]::placeholder {
        color: rgba(223, 230, 233, 0.5);
    }

    .preferences-container {
        background-color: rgba(0, 0, 0, 0.2);
        padding: 1.2rem;
        border-radius: 10px;
        margin-bottom: 1.8rem;
        border: 1px solid var(--border-color);
        position: relative;
        z-index: 1;
    }

    .preferences-title {
        font-weight: 500;
        margin-bottom: 12px;
        color: var(--light-text);
    }

    .checkbox-group {
        display: flex;
        align-items: center;
        margin: 12px 0;
    }

    .checkbox-container {
        display: flex;
        align-items: center;
        margin-right: 20px;
        cursor: pointer;
    }

    .checkbox-container input {
        opacity: 0;
        position: absolute;
    }

    .checkmark {
        position: relative;
        height: 22px;
        width: 22px;
        background-color: var(--input-bg);
        border: 2px solid var(--border-color);
        border-radius: 6px;
        margin-right: 10px;
        transition: all 0.2s ease;
    }

    .checkbox-container:hover .checkmark {
        border-color: var(--primary-color);
    }

    .checkbox-container input:checked ~ .checkmark {
        background: var(--accent-gradient);
        border-color: var(--primary-color);
    }

    .checkmark:after {
        content: "";
        position: absolute;
        display: none;
        left: 7px;
        top: 3px;
        width: 5px;
        height: 10px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    .checkbox-container input:checked ~ .checkmark:after {
        display: block;
    }

    button {
        background: var(--accent-gradient);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 14px 20px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        width: 100%;
        transition: all 0.3s ease;
        font-family: 'Poppins', sans-serif;
        position: relative;
        z-index: 1;
        box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(108, 92, 231, 0.6);
    }

    button:active {
        transform: translateY(0);
    }

    .result {
        margin-top: 1.8rem;
        padding: 1.2rem;
        border-radius: 10px;
        display: none;
        text-align: center;
        animation: fadeIn 0.5s ease;
        position: relative;
        z-index: 1;
    }

    .success {
        background-color: rgba(0, 184, 148, 0.1);
        border: 1px solid var(--success-color);
        color: var(--success-color);
    }

    .error {
        background-color: rgba(214, 48, 49, 0.1);
        border: 1px solid var(--error-color);
        color: var(--error-color);
    }

    .user-id {
        background-color: rgba(0, 0, 0, 0.2);
        padding: 10px;
        border-radius: 6px;
        font-family: monospace;
        margin-top: 12px;
        word-break: break-all;
        border: 1px solid rgba(108, 92, 231, 0.3);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
        .container {
            padding: 1.8rem;
        }
        
        h1 {
            font-size: 1.5rem;
        }
        
        .checkbox-group {
            flex-direction: column;
            align-items: flex-start;
        }
        
        .checkbox-container {
            margin-bottom: 10px;
        }
    }
</style>
</head> <body> <div class="container"> <h1>Add New Recipient</h1> <form id="userForm"> <div class="form-group"> <label for="name">Full Name</label> <input type="text" id="name" name="name" required placeholder="Enter recipient's name"> </div> <div class="form-group"> <label for="email">Email Address</label> <input type="email" id="email" name="email" required placeholder="Enter email address"> </div> <div class="form-group"> <label for="phone">Phone Number</label> <input type="text" id="phone" name="phone" placeholder="+91XXXXXXXXXX"> </div>
text
        <div class="preferences-container">
            <div class="preferences-title">Notification Preferences</div>
            <div class="checkbox-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="emailPref" name="emailPref" checked>
                    <span class="checkmark"></span>
                    Email
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="smsPref" name="smsPref" checked>
                    <span class="checkmark"></span>
                    SMS
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="inAppPref" name="inAppPref" checked>
                    <span class="checkmark"></span>
                    In-App
                </label>
            </div>
        </div>
        
        <button type="submit">Add Recipient</button>
    </form>
    <div id="result" class="result"></div>
</div>

<script>
    document.getElementById('userForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const userData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            preferences: {
                email: document.getElementById('emailPref').checked,
                sms: document.getElementById('smsPref').checked,
                inApp: document.getElementById('inAppPref').checked
            }
        };
        
        try {
            const response = await fetch('/users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(userData)
            });
            
            const result = await response.json();
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            
            if (response.ok) {
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <p>✅ User added successfully!</p>
                    <p>User ID: <span class="user-id">${result.user.id}</span></p>
                `;
                document.getElementById('userForm').reset();
            } else {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<p>❌ Error: ${result.message}</p>`;
            }
        } catch (error) {
            console.error('Error:', error);
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result error';
            resultDiv.innerHTML = `<p>❌ Error: ${error.message}</p>`;
            resultDiv.style.display = 'block';
        }
    });
</script>
</body> </html>
